---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productsapideployment
  namespace: backend   # 👈 IMPORTANT
spec:
  replicas: 1
  selector:
    matchLabels:
      app: products
  template:
    metadata:
      labels:
        app: products
    spec:
      containers:
      - name: products-container
        image: ashokit/products
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: productssvc
  namespace: backend   # 👈 IMPORTANT
spec:
  type: LoadBalancer
  selector:
    app: products
  ports:
  - port: 80
    targetPort: 8080
